name: Publish privacy policy
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pages cannot be enabled by GITHUB_TOKEN. The site must be created
      # once in repository Settings > Pages with Source = GitHub Actions.
      - name: Verify GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! MODE="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null)"; then
            echo "::error title=GitHub Pages not enabled::Open repository Settings > Pages and select GitHub Actions under Build and deployment / Source."
            exit 1
          fi
          if [ "$MODE" != "workflow" ]; then
            echo "::error title=GitHub Pages source incorrect::Set Settings > Pages > Build and deployment / Source to GitHub Actions (currently: $MODE)."
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
