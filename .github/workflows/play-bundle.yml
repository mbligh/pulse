name: Build and upload Play Store bundle
# Re-publish Pulse internal testing with a fresh version code.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/play-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-play
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check Pulse signing and Play credentials
        id: check
        env:
          UPLOAD_KEY: ${{ secrets.PULSE_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.PULSE_UPLOAD_PASSWORD }}
          PLAY_ACCOUNT: ${{ secrets.PULSE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$UPLOAD_KEY" ] && [ -n "$UPLOAD_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set PULSE_UPLOAD_KEYSTORE_BASE64 and PULSE_UPLOAD_PASSWORD to enable signed bundles."
          fi
          if [ -n "$PLAY_ACCOUNT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set PULSE_PLAY_SERVICE_ACCOUNT_JSON to enable internal testing uploads."
          fi
  bundle:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PULSE_UPLOAD_KEYSTORE: ${{ github.workspace }}/.private-signing/pulse-upload.p12
      PULSE_UPLOAD_PASSWORD: ${{ secrets.PULSE_UPLOAD_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Pulse upload key
        env:
          UPLOAD_KEY: ${{ secrets.PULSE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p .private-signing
          printf '%s' "$UPLOAD_KEY" | base64 --decode > "$PULSE_UPLOAD_KEYSTORE"
      - name: Assign unique Play version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "PULSE_VERSION_CODE=$((10000 + RUN_NUMBER * 100 + RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        run: gradle --no-daemon :app:bundleRelease
      - name: Verify bundle signature
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > .private-signing/verification.txt
          cat .private-signing/verification.txt
          grep -q 'jar verified' .private-signing/verification.txt
      - name: Save signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload to Play internal testing
        if: needs.configuration.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PULSE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mbligh.pulse
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: Pulse build ${{ github.run_number }}.${{ github.run_attempt }}
      - name: Remove signing files
        if: always()
        run: rm -rf .private-signing
